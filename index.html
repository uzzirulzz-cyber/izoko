<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PlayBeat Digital — Premium Digital Marketplace & Smart Projectors</title>
    <meta name="description" content="Instant digital keys, gaming accounts, subscriptions, AI tools, SaaS licenses, and high-performance 4K Smart Projectors with 24/7 automated delivery." />
    <meta name="keywords" content="playbeat digital, digital marketplace pakistan, netflix subscription, chatgpt plus, windows 11 key, office 365, steam gift card, xbox game pass, smart 4k projector, magcubic projector, iptv" />
    <meta name="author" content="PlayBeat Digital" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#050814" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://playbeat.digital/" />

    <!-- Open Graph (Facebook / WhatsApp / Telegram link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayBeat Digital" />
    <meta property="og:url" content="https://playbeat.digital/" />
    <meta property="og:title" content="PlayBeat Digital — Premium Digital Marketplace & Smart Projectors" />
    <meta property="og:description" content="Instant digital keys, gaming accounts, subscriptions, AI tools, SaaS licenses, and high-performance 4K Smart Projectors with 24/7 automated delivery." />
    <meta property="og:image" content="https://playbeat.digital/assets/images/playbeat/hero-marketplace.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PlayBeat Digital — Premium Digital Marketplace" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://playbeat.digital/" />
    <meta name="twitter:title" content="PlayBeat Digital — Premium Digital Marketplace & Smart Projectors" />
    <meta name="twitter:description" content="Instant digital keys, gaming accounts, subscriptions, AI tools, SaaS licenses, and high-performance 4K Smart Projectors with 24/7 automated delivery." />
    <meta name="twitter:image" content="https://playbeat.digital/assets/images/playbeat/hero-marketplace.png" />

    <!-- Structured data: Organization + WebSite (helps Google index the brand) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://playbeat.digital/#organization",
          "name": "PlayBeat Digital",
          "url": "https://playbeat.digital/",
          "logo": "https://playbeat.digital/playbeat-logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "support@playbeat.digital",
            "availableLanguage": ["English", "Urdu"]
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Abbottabad",
            "addressRegion": "Khyber Pakhtunkhwa",
            "addressCountry": "PK"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://playbeat.digital/#website",
          "url": "https://playbeat.digital/",
          "name": "PlayBeat Digital",
          "description": "Premium digital marketplace & smart projectors",
          "publisher": { "@id": "https://playbeat.digital/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://playbeat.digital/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-[#0A0A0B] text-[#E0E0E0] antialiased selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
