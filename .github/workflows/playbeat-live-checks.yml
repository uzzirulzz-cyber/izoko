name: PlayBeat.live admin checks
on:
  pull_request:
    paths:
      - 'api/admin/index.ts'
      - 'api/_lib/playbeatLive.ts'
      - 'src/components/admin/PlaybeatLivePanel.tsx'
      - 'src/types/playbeatLive.ts'
      - 'scripts/test_playbeat_live.ts'
      - 'package*.json'
      - '.github/workflows/playbeat-live-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:playbeat-live
      - run: npm run build
