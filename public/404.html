<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found (404) | PlayBeat Digital</title>
  <meta name="description" content="The page you are looking for does not exist. Browse PlayBeat Digital products, subscriptions, gift cards and smart projectors." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://playbeat.digital/404" />
  <link rel="icon" type="image/png" href="/playbeat-logo.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #050814; color: #cbd5e1; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    .box { text-align: center; max-width: 520px; }
    .code {
      font-size: clamp(84px, 18vw, 140px); font-weight: 900; letter-spacing: -.04em;
      background: linear-gradient(135deg, #facc15, #f59e0b 55%, #38bdf8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { color: #fff; font-size: 22px; font-weight: 800; margin: 6px 0 10px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn {
      text-decoration: none; font-size: 13px; font-weight: 700; padding: 12px 22px;
      border-radius: 14px; transition: transform .15s ease, background .15s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-gold { background: linear-gradient(135deg, #fde047, #f59e0b); color: #0f172a; }
    .btn-ghost { background: #0a122e; color: #e2e8f0; border: 1px solid rgba(148,163,184,.2); }
    .btn-ghost:hover { border-color: rgba(251,191,36,.5); color: #fde047; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Oops! This page doesn't exist.</h1>
    <p>The link may be broken or the page may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a class="btn btn-gold" href="/">&larr; Back to Home</a>
      <a class="btn btn-ghost" href="/#popular-products-section">Shop Products</a>
      <a class="btn btn-ghost" href="/contact">Contact Support</a>
    </div>
  </div>
</body>
</html>
